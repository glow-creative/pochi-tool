<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>色見本の計測</title>
<link rel="stylesheet" href="styles.css" />
<style>
  html, body {
    height: auto !important;
    min-height: 0 !important;
    overflow: visible !important;
    position: static !important;
    touch-action: auto !important;
    overscroll-behavior: auto !important;
    display: block !important;
  }
  body { margin: 0; padding: 16px; background: #fff; font: 15px/1.6 "Hiragino Sans", sans-serif; color: #2e2e2a; }
  h2 { margin: 20px 0 6px; font-size: 16px; }
  pre { margin: 0; padding: 10px; border-radius: 8px; background: #f2f2f0; font: 13px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
  .box { max-width: 300px; margin-bottom: 6px; padding: 6px; border: 1px dashed #bbb; }
  .flex .palette-swatches { display: flex; gap: 3px; }
  .flex .swatch { flex: 1 1 0; width: auto; }
  .fixed .swatch { width: calc((100% - 36px) / 13); max-width: 25px; }
</style>
</head>
<body>
<h2>まず、これを試してください：拡大の止め方くらべ</h2>
<p style="margin:0 0 6px">それぞれの四角を<b>指で2回</b>叩いて、<b>画面が拡大するかどうか</b>を見てください。</p>
<div id="zoomA" style="display:grid;place-items:center;height:90px;margin-bottom:8px;border:2px solid #888;border-radius:12px;background:#fdd;touch-action:none;font-size:15px">A：touch-action: none（今と同じ）</div>
<div id="zoomB" style="display:grid;place-items:center;height:90px;margin-bottom:8px;border:2px solid #888;border-radius:12px;background:#dfd;touch-action:none;font-size:15px">B：2回目の指を離す動作を止める</div>
<div id="zoomC" style="display:grid;place-items:center;height:90px;margin-bottom:8px;border:2px solid #888;border-radius:12px;background:#ddf;touch-action:manipulation;font-size:15px">C：touch-action: manipulation</div>
<pre id="zoomLog">まだ叩いていません</pre>

<h2>1. 今のCSSのまま</h2>
<div class="box" id="a"><div class="palette-families"><div class="palette-family palette-family--dads"><div class="palette-swatches" style="--palette-columns: 13"></div></div></div></div>

<h2>2. flex で並べた場合</h2>
<div class="box flex" id="b"><div class="palette-families"><div class="palette-family palette-family--dads"><div class="palette-swatches" style="--palette-columns: 13"></div></div></div></div>

<h2>3. 幅を計算で固定した場合</h2>
<div class="box fixed" id="c"><div class="palette-families"><div class="palette-family palette-family--dads"><div class="palette-swatches" style="--palette-columns: 13"></div></div></div></div>

<h2>4. ダブルタップの計測</h2>
<p style="margin:0 0 6px">下の四角を、<b>いつもの調子で2回</b>叩いてください。ペンと指の両方でお願いします。</p>
<div id="tapper" style="display:grid;place-items:center;height:130px;border:2px dashed #888;border-radius:12px;background:#f7f7f5;touch-action:none;font-size:15px">ここを2回</div>
<pre id="taps" style="margin-top:6px">まだ計測していません</pre>

<h2>計測結果</h2>
<pre id="out">…</pre>

<script>
  const colours = ["#e8f1ff","#d0e2ff","#b3d0ff","#93b9ff","#6f9eff","#4a80ff","#2b62f6","#1a4fd6","#0f3fb5","#0a3194","#072673","#051c52","#031231"];
  for (const id of ["a", "b", "c"]) {
    const row = document.querySelector("#" + id + " .palette-swatches");
    for (const colour of colours) {
      const swatch = document.createElement("button");
      swatch.type = "button";
      swatch.className = "swatch";
      swatch.style.setProperty("--swatch", colour);
      row.append(swatch);
    }
  }
  const report = () => {
    const row = document.querySelector("#a .palette-swatches");
    const swatches = [...row.querySelectorAll(".swatch")];
    const first = swatches[0].getBoundingClientRect();
    const second = swatches[1].getBoundingClientRect();
    const style = getComputedStyle(swatches[0]);
    const rowStyle = getComputedStyle(row);
    const lines = [
      "端末 " + navigator.userAgent.replace(/^Mozilla\/5.0 \(/, "").slice(0, 60),
      "画面 " + window.innerWidth + "×" + window.innerHeight + "  倍率 " + window.devicePixelRatio + "  拡大 " + (window.visualViewport ? window.visualViewport.scale.toFixed(2) : "?"),
      "",
      "並びの幅 " + row.getBoundingClientRect().width.toFixed(1),
      "列の指定 " + rowStyle.gridTemplateColumns,
      "すき間 " + rowStyle.columnGap,
      "",
      "色見本 幅 " + first.width.toFixed(1) + " 高さ " + first.height.toFixed(1),
      "隣との間隔 " + (second.left - first.right).toFixed(1) + "  ← 3.0 なら正常、0以下なら重なり",
      "",
      "min-width " + style.minWidth + "  min-height " + style.minHeight,
      "line-height " + style.lineHeight + "  font-size " + style.fontSize,
      "box-sizing " + style.boxSizing + "  padding " + style.padding,
      "border " + style.borderTopWidth + "  aspect-ratio " + style.aspectRatio,
    ];
    document.querySelector("#out").textContent = lines.join("\n");
  };
  report();
  window.addEventListener("resize", report);

  // Bだけ、2回目に指を離す動作そのものを止める（拡大の芽を摘む）
  const zoomLog = document.querySelector("#zoomLog");
  const note = (line) => {
    zoomLog.textContent = (zoomLog.textContent.startsWith("まだ") ? "" : zoomLog.textContent + "\n") + line;
  };
  let lastB = 0;
  document.querySelector("#zoomB").addEventListener("touchend", (event) => {
    const now = Date.now();
    if (now - lastB < 600) {
      event.preventDefault();
      note("B：2回目を止めました（" + (now - lastB) + "ms）");
    }
    lastB = now;
  }, { passive: false });
  for (const id of ["zoomA", "zoomC"]) {
    let last = 0;
    document.querySelector("#" + id).addEventListener("touchend", () => {
      const now = Date.now();
      if (now - last < 600) { note(id.slice(4) + "：2回目（" + (now - last) + "ms）"); }
      last = now;
    });
  }

  // ダブルタップの間隔と、2回の指先の距離を測る
  const tapper = document.querySelector("#tapper");
  const taps = document.querySelector("#taps");
  const history = [];
  tapper.addEventListener("pointerdown", (event) => {
    const now = { kind: event.pointerType, at: Date.now(), x: event.clientX, y: event.clientY };
    const last = history[history.length - 1];
    history.push(now);
    if (last && now.at - last.at < 1500 && last.kind === now.kind) {
      const gap = now.at - last.at;
      const move = Math.round(Math.hypot(now.x - last.x, now.y - last.y) * 10) / 10;
      const line = `${now.kind}：間隔 ${gap}ms　ずれ ${move}px　${gap <= 350 ? "350ms以内" : "★350msを超えた"}`;
      taps.textContent = (taps.textContent.startsWith("まだ") ? "" : taps.textContent + "\n") + line;
    }
  });
</script>
</body>
</html>
